<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Painel de Controle</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080810;--surface:#0f0f1a;--surface2:#161625;--border:#1e1e35;--accent:#ff3e6c;--accent2:#00e5ff;--green:#00ff88;--text:#e8e8f5;--muted:#4a4a6a;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:grid;place-items:center;padding:2rem}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
  body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 15% 15%,rgba(255,62,108,.07) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 85% 85%,rgba(0,229,255,.05) 0%,transparent 60%);pointer-events:none}
  .shell{position:relative;z-index:1;width:100%;max-width:580px;display:flex;flex-direction:column;gap:1px}
  .topbar{background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:.75rem 1.25rem;display:flex;align-items:center;gap:10px}
  .dr{width:12px;height:12px;border-radius:50%}
  .topbar-title{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.08em}
  .card{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:2.5rem}
  .header-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;gap:1rem}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,62,108,.1);border:1px solid rgba(255,62,108,.25);color:var(--accent);font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:.75rem}
  .badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.4s ease infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  h1{font-size:1.9rem;font-weight:800;letter-spacing:-.04em;line-height:1.1}
  h1 span{color:var(--accent)}
  .status-pill{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:50px;padding:4px 10px;transition:all .3s}
  .status-pill .led{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .3s}
  .status-pill.connected .led{background:var(--green);animation:blink 2s infinite}
  .status-pill.connected{color:var(--green);border-color:rgba(0,255,136,.2);background:rgba(0,255,136,.05)}
  .status-pill.error .led{background:var(--accent)}
  .status-pill.error{color:var(--accent);border-color:rgba(255,62,108,.2);background:rgba(255,62,108,.05)}
  .fields{display:flex;flex-direction:column;gap:1rem;margin-bottom:1.5rem}
  .field-wrap{display:flex;flex-direction:column;gap:6px}
  .field-label{display:flex;justify-content:space-between;align-items:center}
  label{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .counter{font-family:var(--mono);font-size:.6rem;color:var(--muted)}
  input[type="text"],input[type="url"]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.82rem;padding:.75rem 1rem;outline:none;transition:border-color .2s,box-shadow .2s}
  input[type="text"]:focus,input[type="url"]:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(0,229,255,.07)}
  input::placeholder{color:var(--muted)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
  .toggle-label{font-family:var(--mono);font-size:.75rem;color:var(--text)}
  .toggle{position:relative;width:40px;height:22px}
  .toggle input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--border);border-radius:22px;cursor:pointer;transition:background .2s}
  .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:transform .2s,background .2s}
  .toggle input:checked+.slider{background:rgba(0,255,136,.2);border:1px solid rgba(0,255,136,.3)}
  .toggle input:checked+.slider::before{transform:translateX(18px);background:var(--green)}
  .btn{width:100%;padding:1rem;border:none;border-radius:8px;color:#fff;font-family:var(--sans);font-size:.9rem;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:all .2s}
  .btn-publish{background:var(--accent);margin-bottom:1rem}
  .btn-publish:not(:disabled):hover{background:#e8305c;transform:translateY(-1px);box-shadow:0 8px 28px rgba(255,62,108,.35)}
  .btn-publish:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
  .btn-publish.success{background:var(--green)!important;color:#000!important}
  .preview{background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .preview-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;border-bottom:1px solid var(--border)}
  .preview-title{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .live-badge{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.6rem;color:var(--green)}
  .live-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite}
  .preview-body{padding:1rem;font-family:var(--mono);font-size:.72rem}
  .preview-row{display:flex;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--border);align-items:baseline}
  .preview-row:last-child{border-bottom:none}
  .pk{color:var(--muted);min-width:80px;font-size:.65rem}
  .pv{color:var(--accent2);word-break:break-all}
  .pv.empty{color:var(--muted);font-style:italic}
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);font-family:var(--mono);font-size:.78rem;font-weight:600;padding:.65rem 1.5rem;border-radius:50px;pointer-events:none;z-index:9999;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.ok{background:var(--green);color:#000}
  .toast.err{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="dr" style="background:#ff5f57"></div>
    <div class="dr" style="background:#febc2e"></div>
    <div class="dr" style="background:#28c840"></div>
    <span class="topbar-title">admin.html — painel de controle</span>
  </div>
  <div class="card">
    <div class="header-row">
      <div>
        <div class="badge"><span class="badge-dot"></span>Admin Panel</div>
        <h1>Publicar<br><span>Link</span></h1>
      </div>
      <div>
        <div class="status-pill" id="status-pill">
          <div class="led"></div>
          <span id="status-text">conectando…</span>
        </div>
      </div>
    </div>

    <div class="fields">
      <div class="field-wrap">
        <div class="field-label">
          <label for="f-text">Texto do botão</label>
          <span class="counter" id="cnt-text">0/60</span>
        </div>
        <input type="text" id="f-text" placeholder="ex: Acesse nosso site" maxlength="60">
      </div>
      <div class="field-wrap">
        <div class="field-label"><label for="f-url">URL de destino</label></div>
        <input type="url" id="f-url" placeholder="https://exemplo.com">
      </div>
      <div class="field-wrap">
        <div class="field-label">
          <label for="f-desc">Descrição</label>
          <span class="counter" id="cnt-desc">0/100</span>
        </div>
        <input type="text" id="f-desc" placeholder="Breve descrição do link (opcional)" maxlength="100">
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Link visível na página</span>
        <label class="toggle">
          <input type="checkbox" id="f-visible" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button class="btn btn-publish" id="btn-publish" onclick="publishLink()" disabled>Publicar Link</button>

    <div class="preview">
      <div class="preview-header">
        <span class="preview-title">Estado no Firebase</span>
        <span class="live-badge">live</span>
      </div>
      <div class="preview-body">
        <div class="preview-row"><span class="pk">texto</span><span class="pv empty" id="pv-text">—</span></div>
        <div class="preview-row"><span class="pk">url</span><span class="pv empty" id="pv-url">—</span></div>
        <div class="preview-row"><span class="pk">descrição</span><span class="pv empty" id="pv-desc">—</span></div>
        <div class="preview-row"><span class="pk">visível</span><span class="pv empty" id="pv-visible">—</span></div>
        <div class="preview-row"><span class="pk">atualizado</span><span class="pv empty" id="pv-time">—</span></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAR6T8J5EZE5TT2a2OAGs2YDvmKu-XzXEQ",
    databaseURL: "https://afiliados-5ae3a-default-rtdb.firebaseio.com",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const linkRef = ref(db, 'link');

  // char counters
  document.getElementById('f-text').addEventListener('input', function(){ document.getElementById('cnt-text').textContent = this.value.length+'/60'; });
  document.getElementById('f-desc').addEventListener('input', function(){ document.getElementById('cnt-desc').textContent = this.value.length+'/100'; });

  function setStatus(type, text){
    document.getElementById('status-pill').className = 'status-pill '+type;
    document.getElementById('status-text').textContent = text;
  }

  function showToast(msg, type){
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast '+type+' show';
    setTimeout(()=> t.className = 'toast '+type, 2800);
  }

  function updatePreview(d){
    const s = (id,v) => { const el=document.getElementById(id); el.textContent=v||'—'; el.classList.toggle('empty',!v); };
    s('pv-text',d.text); s('pv-url',d.url); s('pv-desc',d.desc);
    const pv = document.getElementById('pv-visible');
    pv.textContent = d.visible ? 'sim' : 'não'; pv.classList.remove('empty');
    s('pv-time',d.updatedAt);
  }

  // Listen for live changes
  onValue(linkRef, (snap) => {
    setStatus('connected','● conectado');
    document.getElementById('btn-publish').disabled = false;
    const d = snap.val();
    if(d){
      updatePreview(d);
      if(!document.getElementById('f-text').value && d.text){ document.getElementById('f-text').value=d.text; document.getElementById('cnt-text').textContent=d.text.length+'/60'; }
      if(!document.getElementById('f-url').value && d.url) document.getElementById('f-url').value=d.url;
      if(!document.getElementById('f-desc').value && d.desc){ document.getElementById('f-desc').value=d.desc; document.getElementById('cnt-desc').textContent=d.desc.length+'/100'; }
      if(d.visible !== undefined) document.getElementById('f-visible').checked = d.visible;
    }
  }, (err) => {
    setStatus('error','✕ erro de conexão');
    showToast('Erro Firebase: '+err.message, 'err');
  });

  window.publishLink = async function(){
    const config = {
      text:    document.getElementById('f-text').value.trim() || 'Acesse agora',
      url:     document.getElementById('f-url').value.trim() || '',
      desc:    document.getElementById('f-desc').value.trim(),
      visible: document.getElementById('f-visible').checked,
      updatedAt: new Date().toLocaleString('pt-BR'),
    };
    const btn = document.getElementById('btn-publish');
    btn.disabled=true; btn.textContent='Publicando…';
    try{
      await set(linkRef, config);
      btn.textContent='✓ Publicado!'; btn.classList.add('success');
      showToast('Link publicado em tempo real! 🚀','ok');
      setTimeout(()=>{ btn.textContent='Publicar Link'; btn.classList.remove('success'); btn.disabled=false; }, 2500);
    }catch(e){
      btn.textContent='Publicar Link'; btn.disabled=false;
      showToast('Erro: '+e.message,'err');
    }
  };
</script>
</body>
</html>
