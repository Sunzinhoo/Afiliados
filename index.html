  html,body{width:100%;height:100%;background:#FFE600}

<body>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, onValue, push, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

  const app = initializeApp({
    apiKey: "AIzaSyAR6T8J5EZE5TT2a2OAGs2YDvmKu-XzXEQ",
    databaseURL: "https://afiliados-5ae3a-default-rtdb.firebaseio.com",
  });
  const db = getDatabase(app);

  // ── Registra acesso ──────────────────────────────────────
  function parseUA(ua){
    let os = 'Desconhecido', browser = 'Desconhecido', device = '💻 Desktop';

    if(/android/i.test(ua))       { os = 'Android';  device = '📱 Mobile'; }
    else if(/iphone|ipad/i.test(ua)){ os = 'iOS';    device = /ipad/i.test(ua) ? '📱 Tablet' : '📱 Mobile'; }
    else if(/windows/i.test(ua))  { os = 'Windows'; }
    else if(/mac os/i.test(ua))   { os = 'macOS'; }
    else if(/linux/i.test(ua))    { os = 'Linux'; }

    if(/edg\//i.test(ua))         browser = 'Edge';
    else if(/opr\//i.test(ua))    browser = 'Opera';
    else if(/chrome/i.test(ua))   browser = 'Chrome';
    else if(/safari/i.test(ua))   browser = 'Safari';
    else if(/firefox/i.test(ua))  browser = 'Firefox';

    return { os, browser, device };
  }

  async function registerAccess(){
    const ua = navigator.userAgent;
    const { os, browser, device } = parseUA(ua);
    const lang = navigator.language || '—';
    const screen = `${window.screen.width}x${window.screen.height}`;

    // Tenta pegar país via API gratuita
    let country = '—', city = '—', ip = '—';
    try {
      const r = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(3000) });
      const d = await r.json();
      country = (d.country_name || '—');
      city    = (d.city || '—');
      ip      = (d.ip || '—');
    } catch(e){}

    await push(ref(db, 'acessos'), {
      device, os, browser, lang, screen,
      country, city, ip,
      ts: new Date().toLocaleString('pt-BR'),
      tsUnix: Date.now(),
    });
  }

  registerAccess();

  // ── Redireciona ──────────────────────────────────────────
  let redirected = false;
  onValue(ref(db, 'link'), (snap) => {
    const d = snap.val();
    if(d && d.visible !== false && d.url && !redirected){
      redirected = true;
      window.location.replace(d.url);
    }
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferredPrompt=e; });
  window.addEventListener('appinstalled',()=>{ deferredPrompt=null; });
</script>
</body>
